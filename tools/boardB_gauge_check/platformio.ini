; 基板B (BQ25792 + BQ28Z620) の I2C 確認用スケッチ。本体ファームとは別のプロジェクト。
;
;   pio run -d tools/boardB_gauge_check -t upload     USB 書き込み
;   pio device monitor -d tools/boardB_gauge_check    シリアル (115200)
;
; 配線と使い方は src/main.cpp の先頭。

[env:xiao_esp32s3]
platform = espressif32@^6.8.1
platform_packages =
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	Wire
