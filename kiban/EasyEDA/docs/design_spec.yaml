# Isolation Sphere 電源システムの機械可読サマリ。
# キーとネット名は英語のまま（スクリプトから参照するため）。説明文は日本語。
# 人が読む根拠は README.md と docs/*.md を参照。

project:
  name: isolation-sphere-power
  revision: architecture-baseline-2026-10-07
  status: adopted  # 2026-10-07 採用。kiban/power-2s は参考資料扱い
  pcb_tool: EasyEDA
  pcb_tool_edition: Pro  # 進め方は easyeda_workflow.md

battery_connection:
  connector: JST XH 2P x 2  # セルごと、3 A / ピン、AWG22
  J_CELL1: [B-, BM]
  J_CELL2: [BM, B+]
  series_link_on_board_B: true
  discharge_cutoff_V_min: 6.4  # 1 セル 3.2 V。XH の 3 A を守るため
  fits_core_03: true  # 実機で収納確認済み（2026-10-08）。内殻は再設計してよい
  cell_mm: [40, 40, 10]
  core_inner_shell_redesign_allowed: true
  board_a_tab:  # ピンソケット 1x6（FH-1x6SG/RH）を載せる張り出し。向きは ±y（±15°）
    socket_center_x: 22.86
    x_out: 24.63
    half_y: 8.12
    legacy: {x_out: 25.0, half_y: 9.25}
  board_b_outline:  # 決定（2026-10-08）：隅を面取りした 40 mm 角。A↔B 7 mm で内殻に当たらない最小は 7 mm
    side: 40
    corner_chamfer: 8  # すき間 1.3 mm、面積 92%
    alternatives_rejected: [{side: 37.0}]
  stack_order_north_to_south: [MCU, LiPo_N, mother_ring, LiPo_S, board_A, board_B]
  stack_gap_parts: Akizuki FH-1x6SG/RH (socket, 8.5 mm housing)

battery:
  chemistry: LiPo
  series_cells: 2
  cell_capacity_mAh: 2000
  pack_capacity_mAh: 2000
  nominal_pack_voltage_V: 7.4
  full_charge_voltage_V: 8.4
  nominal_energy_Wh: 14.8
  cell_midpoint_available: true

power_budget:
  battery_current_limit_A: 2.0  # ユーザー決定（2026-10-08）。セルの PCM と 1.5C を避けるため
  led_current_at_limit_A: {at_8V4: 3.6, at_7V4: 3.0, at_6V4: 2.5}
  led_output_W: 13.2   # 3.3 V × 4 A
  mcu_output_W: 3.3    # 3.3 V × 1 A
  assumed_buck_efficiency: 0.90
  vsys_input_W: 18.3
  vsys_nominal_V: 7.4
  vsys_current_A:
    at_8V4: 2.2
    at_7V4: 2.5
    at_6V0: 3.1
  design_continuous_current_A: 3.0  # 基板間コネクタ・保護 FET・BATFET の下限
  full_load_runtime_min: 48

charging:
  input_voltage_range_V: [5, 12]
  recommended_input_V: 12
  input_connector: 南極マグネット接点
  operation_while_charging_required: true
  charger: BQ25792RQMR  # 2026-10-08 確定、LCSC C2862876、VQFN-29
  charger_pin_compatible_alternative: BQ25798
  charger_prog_resistor: 2S  # 1.5 MHz=6.04k / 750 kHz=8.2k
  autonomous_default_charge: {vreg_V: 8.4, ichg_A: 1.0, iindpm_A: 3.0, vac_ovp_V: 26}
  watchdog_default_s: 40
  required_input_power_full_load_plus_1A_charge_W: 29
  charge_current_A: TBD
  input_current_limit_A: TBD

board_a:
  role: system_power_and_mother_ring_interface
  size_mm: [40, 40]
  position: upper
  component_sides: both
  functions:
    - LTC2954 電源制御
    - 3V3_AON 低 Iq レギュレータ
    - LED 用 3.3 V 降圧
    - MCU 用 3.3 V 降圧
    - mother-ring への電源分配
    - 基板B インターフェース
  power_control:
    baseline_controller: LTC2954-1
    package: TSOT-23-8
    supply_net: VSYS
    en_polarity: active_high_open_drain
    c_ont_uF: 0.33
    c_pdt_uF: 1.2
    on_hold_s: {nominal: 2.15, min: 1.5, max: 2.8}
    forced_off_hold_s: {nominal: 7.8, min: 5.5, max: 10.0}
    kill_on_blanking_ms: {min: 400, typ: 512, max: 650}
    en_lockout_after_off_ms: {min: 200, typ: 256, max: 325}
    kill_pullup: 100k_to_3V3_MCU
    pb_input_network: series_5k1_and_100nF_to_GND
    int_output: test_pad_optional
    wake_sensor: DRV5032FCDBZR
    normal_off_sensor: TMAG5273_via_ESP32
    forced_off: LTC2954_hardware_long_hold
  led_buck:
    output_V: 3.3
    expected_load_A: 3.0
    desired_system_capacity_A: 4.0
    preferred_converter_class_A: 5_to_6
    enable_net: LED_EN
    default_enable_state: off
    exact_part: TBD
    candidate: TPS56637
  mcu_buck:
    output_V: 3.3
    target_current_A: 1_to_2
    enable_control: LTC2954_EN
    enable_polarity: active_high
    exact_part: TBD

board_b:
  role: battery_charge_bms
  fuse:  # 決定（2026-10-08）：リセッタブル。球体を開けずに復帰できることを優先
    part: SMD2920P500TF/16
    manufacturer: PTTC
    lcsc: C108585
    package: 2920
    ihold_A: 5.0
    itrip_A: 10.0
    vmax_V: 16
    tripped_power_W: 2.0
    placement: B_plus_series_near_J_CELL2_away_from_LiPo
    rejected: [{part: SF-1206S500-2, lcsc: C913282, reason: one_time}]
  protection_fet:
    part: FS8205A
    manufacturer: FUXINSEMI
    lcsc: C908265
    package: SOT-23-6
    config: dual_N_common_drain
    vgs_max_V: 12
  size_mm: [40, 40]
  position: lower_lipo_side
  component_sides:
    top: allowed
    bottom: forbidden
  charger: BQ25792
  gauge_protector: BQ28Z620DRZR  # 2026-10-08 確定。BQ28Z610-R1 の後継、ピン互換
  gauge_lcsc: C20345237  # 64 個（2026-10-08）。JLC 登録 C22395771 は購入不可
  gauge_settings: {broadcast: disabled, cuv_mV_per_cell_min: 3200}
  functions:
    - 2S 充電
    - パワーパス
    - 残量計測
    - 自律的な電池保護
    - 電流測定
    - セルバランス
  external_components:
    - protection_FETs
    - current_shunt
    - thermistors
    - charger_inductor
  lipo_side_rules:
    no_components: true
    avoid_exposed_test_pads: true
    prefer_tented_vias: true
    rounded_corners: true
    insulating_film_required: true

north_pole:
  always_on_sensor:
    part: DRV5032FCDBZR
    package: SOT-23
    response: omnipolar
    output: open_drain_active_low
    sample_rate_Hz: 20
    avg_supply_current_uA: 1.3
    bop_max_mT: 4.8
    supply: 3V3_AON
    output_net: HALL_WAKE
    alternative: DRV5032AJ  # 誤検出が問題になる場合（最大 9.5 mT）
  gesture_sensor:
    part: TMAG5273
    supply: 3V3_MCU
    bus: I2C
  display_pixel:
    part: WS2812C-2020-V6
    supply: 3V3_LED
    data_line: line05
    pixel_index: 161
    is_indicator: false
  optional_indicator:
    required: false
    off_state_operation_required: false
    purpose: ホール / コマンド受付の表示

led:
  part: WS2812C-2020-V6  # 確定
  lcsc: C55109522
  package: SMD2020-4P
  count_approx: 800
  rail_V: 3.3
  rail_setpoint_V: 3.4_to_3.5  # VDD 下限が 3.3 V のため電圧降下分を上乗せ。実測後に確定
  vdd_range_V: [3.3, 5.3]  # データシート V1.0（2026-05-21）
  vih: 0.55_x_VDD
  current_per_channel_mA: 5
  max_current_all_white_A: 12  # 800 × 15 mA。ファームで 4 A 以下に制限

mother_ring:
  connector_count: 2
  connector_type: 1x6_2.54mm
  current_rating_per_pin_A: verify_exact_pair
  ground_note: GND_L / GND_R / GND_SYS はすべて同一の GND ネット
  left:
    1: 3V3_LED_L
    2: GND_L
    3: 3V3_MCU
    4: I2C_SDA
    5: I2C_SCL
    6: 3V3_AON
  right:
    1: 3V3_LED_R
    2: GND_R
    3: GND_SYS
    4: HALL_WAKE
    5: PWR_KILL
    6: LED_EN

board_a_to_b:
  connector: Akizuki PH-1x40SG cut to 2 x 1x6  # 2.54 mm、3 A / ピン
  spacer_mm: 4.5
  board_gap_mm: 7.0
  pinout_proposal:
    J_AB1: [VSYS, VSYS, VSYS, GND, GND, GND]
    J_AB2: [I2C_SDA, GND, I2C_SCL, CHG_INT, NC, GND]
  min_continuous_current_A: 3.0
  required_nets:
    - VSYS
    - GND
    - I2C_SDA
    - I2C_SCL
  optional_nets:
    - BATT_INT
    - CHG_PRESENT

i2c:
  bringup_speed_kHz: 100
  addresses_7bit:
    charger_BQ25792: 0x6B
    gauge_BQ28Z620: 0x55  # TRM で要確認
    TMAG5273: TBD  # 品種により異なる

power_sequence:
  on:
    - DRV5032FC が意図的な磁石保持を検出
    - LTC2954 が保持時間を判定（約 2.15 s）
    - LTC2954 が MCU レールを有効化
    - 3V3_MCU の立ち上がりで PWR_KILL がプルアップにより High
    - ESP32 が起動
    - 表示レールが必要になった時点で ESP32 が LED_EN をアサート
  normal_off:
    - TMAG5273 のジェスチャを ESP32 が解釈（磁石接近から 3 s 以内）
    - ESP32 が LED データ線を Low に固定し LED_EN をデアサート
    - ESP32 が必要な状態を保存
    - ESP32 が PWR_KILL を Low に駆動
    - LTC2954 が MCU レールを無効化
  forced_off:
    - DRV5032FC と LTC2954 によるハードウェア長押し（約 7.8 s、最小 5.5 s）
    - ESP32 が応答しなくても動作すること

firmware_requirements:  # 詳細は interfaces.md §7
  - FW-1 起動中に PWR_KILL を Low にしない。ストラッピングピンを使わない
  - FW-2 LED_EN は表示が必要になるまで Low。LED_EN が Low の間はデータ線も Low
  - FW-3 シャットダウン順は データ線 Low → LED_EN Low → 保存 → PWR_KILL Low
  - FW-4 OFF ジェスチャは 3 s 以内に完了。4 s 以上の磁石保持を前提とした UI を作らない
  - FW-5 I2C は 100 kHz で立ち上げ、起動時にアドレスをスキャン

legacy_not_baseline:
  - IP2326_module
  - BQ25883
  - XR-2S-30A_module
  - MP1584_module
  - MAX16054
  - MAX17049

open_items:
  - 基板Aの張り出しの向きとソケット位置
  - 電池の電線の経路（北のセル → 基板B）
  - 基板側の XH の形（横向き実装 / 電線 + 中継）
  - 充電 IC と BQ28Z620 の保護付きパワーパス構成
  - 充電入力の供給方法（12 V アダプタ / USB-PD）と入力電流上限
  - LED 降圧の出力電圧（3.4〜3.5 V、末端電圧の実測後に確定）
  - LED 降圧 IC
  - MCU 降圧 IC
  - AON レギュレータ IC
  - DRV5032FC と磁石の距離・磁束密度の確認
  - I2C プルアップの電源ドメイン
  - 充電電流と入力電流制限

resolved_items:
  - 残量計 IC（BQ28Z620）
  - 電池コネクタ（JST XH 2P × 2、セルごと）
  - 充電 IC（BQ25792）と入力電圧の方針（5〜12 V、推奨 12 V）
  - LTC2954 のバリアント（-1）とタイミング部品（C_ONT 0.33 µF、C_PDT 1.2 µF）
  - DRV5032 のバリアント（FC、全極性、オープンドレイン）
  - PWR_KILL のバイアス（3V3_MCU へ 100 kΩ プルアップ）
