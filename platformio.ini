; isolation-sphere solo (XIAO ESP32S3 版) — PlatformIO 設定
;
;   pio run -e xiao_esp32s3                 ビルド (既定)
;   pio run -e xiao_esp32s3 -t upload       USB 書き込み (パーティション表の更新は USB のみ)
;   pio run -e xiao_esp32s3 -t uploadfs     LittleFS (data/) 書き込み
;   pio run -e xiao_esp32s3_ota -t upload   OTA 書き込み (SoftAP 接続後: 192.168.4.1)
;   pio test -e native                      単体テスト (PC上)
;
; ビルド出力を VS Code の PlatformIO 拡張と取り合わないよう、手元で CLI ビルドするときは
; PLATFORMIO_BUILD_DIR を別ディレクトリに向けること。

[platformio]
default_envs = xiao_esp32s3

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32S3 (5 ストリップ / LCD・本体ボタンなし) / 外部 BNO055
; 接続案内の QR は個体シールで渡す (tools/make_wifi_qr.py)。SSID/パスワードは config.json 参照。
; ---------------------------------------------------------------------------
[env:xiao_esp32s3]
platform = espressif32@^6.8.1
platform_packages =
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
build_type = debug
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	; FastLED 3.10 の実行時ログ (FL_WARN) を止める。既定は NDEBUG 未定義で有効になり、
	; Arduino の Serial とは別経路で USB-Serial-JTAG に書く。フラッシュ約 15KB 削減。
	-D FASTLED_LOG_VERBOSITY=0
	; FastLED (3.7.8, IDF4 RMT) の割り込みはフラッシュ上の IDF 関数を呼ぶため、他コアが
	; フラッシュを読んでキャッシュを止めた瞬間に "Cache disabled but cached memory region
	; accessed" でパニックする。solo は LittleFS を 10fps で読み続けるので必ず踏む。
	; show() の間だけ spi_flash_op_lock() でフラッシュ操作を止める。
	-D FASTLED_ESP32_FLASH_LOCK=1
	; FastLED RMT4 (IDF 4.4) の並列度を最大化する。既定 FASTLED_RMT_MEM_BLOCKS=2 は
	; 使える TX チャンネルを 4→2 に半減する。1 にすると 4 チャンネル並列になる。
	; 副作用: Wi-Fi 割り込み負荷が高い状況で稀にちらつく可能性がある。出るなら 2 に戻す。
	-D FASTLED_RMT_MEM_BLOCKS=1
	-fpermissive
	-std=c++14
lib_deps =
	; Core libraries
	Wire
	WiFi
	DNSServer          ; キャプティブポータル (全ホスト名を AP 自身へ解決)
	AsyncUDP           ; UDP 映像受信 (server モード。Arduino core 同梱)

	; JSON configuration
	bblanchon/ArduinoJson@^6.21.3

	; MQTT (server モード。broker は config.json wifi.broker)
	knolleary/PubSubClient@^2.8

	; Image processing (Baseline JPEG -> RGB565)
	bodmer/TJpg_Decoder@^1.0.8

	; LED control
	; 3.10.x は ESP32 の RMT ドライバが ChannelManager 実装に置き換わり、S3 の 5 ストリップ
	; (TX チャンネル 4 本) で挙動が変わる。球体に組み込んで LiPo 起動すると earlyBlank() の
	; 直後に全 LED が白点灯し電源が落ちた (実機 2026-09-22)。動作実績のある 3.7.8 に固定する。
	fastled/FastLED@3.7.8

	; IMU sensor
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1
lib_ldf_mode = deep

; ---------------------------------------------------------------------------
; OTA (espota) 書き込み。ビルド設定は通常 env を継承し、経路だけ差し替える。
; solo は SoftAP なので宛先は AP 自身の IP (config.json の solo.ap.ip)。
; 書き込む PC を先に AP へ接続させること。
; NOTE: パーティション表の変更は OTA では反映されないため、初回は USB で書き込む。
; ---------------------------------------------------------------------------
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

; LAN (STA) 経由の OTA。Web UI の「LAN 接続」で SSID/パスワードを保存して再起動すると、
; 球体は AP を維持したまま普段の Wi-Fi にも繋がる。PC の Wi-Fi を切り替えずに書き込める。
; 宛先は mDNS 名 (ArduinoOTA が <sphere id>.local を広告する。既定 sphere001)。解決できない
; 場合は upload_port に STA の IP (Web UI の「LAN (STA)」欄に出る) を指定する (tools/ota.sh)。
; server モードでは P2P 網の固定 IP (config.json spheres[].static_ip, 例 192.168.49.101)。
[env:xiao_esp32s3_lan_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = sphere001.local
upload_flags =
	--auth=isolation-sphere-ota

; ---------------------------------------------------------------------------
; PC 上の単体テスト: src/JpegScan.h (ヘッダオンリー・Arduino非依存) の境界条件。
; src/ 全体はビルドしない (ESP32 専用コードが含まれるため)。
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; test/mocks/Arduino.h は imu/*.h が使う millis() 等の最小スタブ (派生元 feat/ui-v2 から移植)
build_flags = -I src -I test/mocks -std=c++14 -D NATIVE_ENV
test_build_src = false
